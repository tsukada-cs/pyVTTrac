name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install gfortran (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Install gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          # Homebrew's gcc formula only installs version-suffixed binaries
          # (gfortran-NN, no unversioned `gfortran`), so meson's compiler
          # autodetection needs to be pointed at it explicitly via FC.
          FC_PATH=$(ls "$(brew --prefix gcc)/bin"/gfortran-* | head -n 1)
          echo "Using gfortran at: ${FC_PATH}"
          echo "FC=${FC_PATH}" >> "$GITHUB_ENV"

      - name: Install pyVTTrac + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test,xarray,pandas]"

      - name: Run tests
        run: pytest -v

  # Fortran core must also build (and pass its correctness/perf smoke tests)
  # without OpenMP.
  test-no-openmp:
    name: test (no OpenMP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Install pyVTTrac (OpenMP disabled) + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest" "meson-python>=0.15.0" "numpy>=1.26"
          pip install --no-build-isolation \
            -C setup-args=-Duse_openmp=disabled ".[xarray,pandas]"

      - name: Run tests
        run: pytest -v

  # gfortran's runtime array-bounds checking only fires with -fcheck=bounds,
  # which release wheels never enable (too slow). This is the only CI job
  # that can catch an out-of-bounds Fortran array access before it ships as
  # silent memory corruption in a release build.
  test-bounds-check:
    name: test (debug, bounds-checked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Install pyVTTrac (debug, bounds-checked) + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest" "meson-python>=0.15.0" "numpy>=1.26"
          pip install --no-build-isolation \
            -C setup-args=-Dbuildtype=debug \
            -C setup-args=-Ddebug_bounds_check=true \
            ".[xarray,pandas]"

      - name: Run tests
        run: pytest -v
