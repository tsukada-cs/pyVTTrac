name: Build and publish wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build_wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Install gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          # Homebrew's gcc formula only installs version-suffixed binaries
          # (gfortran-NN, no unversioned `gfortran`), so meson's compiler
          # autodetection needs to be pointed at it explicitly via FC. This
          # must reach cibuildwheel's build subprocess too, hence CIBW_ENVIRONMENT.
          FC_PATH=$(ls "$(brew --prefix gcc)/bin"/gfortran-* | head -n 1)
          echo "Using gfortran at: ${FC_PATH}"
          echo "FC=${FC_PATH}" >> "$GITHUB_ENV"
          echo "CIBW_ENVIRONMENT_MACOS=FC=${FC_PATH}" >> "$GITHUB_ENV"

      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux* *-win32 *_i686 pp*"
          CIBW_ARCHS_MACOS: "auto"
          CIBW_BEFORE_ALL_LINUX: "yum install -y gcc-gfortran || dnf install -y gcc-gfortran"
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest {project}/tests -q"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/pyVTTrac
    permissions:
      id-token: write  # trusted publishing (OIDC) -- no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
