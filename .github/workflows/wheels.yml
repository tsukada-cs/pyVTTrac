name: Build and publish wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build_wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 (Intel) intentionally omitted: GitHub's Intel macOS runner
        # pool has been unreliable (observed 3+ hour queues with no runner
        # ever assigned) and Intel Mac share keeps shrinking since Apple
        # Silicon's 2020 transition. Users without an arm64 wheel available
        # still get a working install via the sdist fallback (needs
        # gfortran, e.g. `brew install gcc`). Revisit if runner availability
        # improves or x86_64 macOS demand shows up.
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Install gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          # Homebrew's gcc formula only installs version-suffixed binaries
          # (gfortran-NN, no unversioned `gfortran`), so meson's compiler
          # autodetection needs to be pointed at it explicitly via FC. This
          # must reach cibuildwheel's build subprocess too, hence CIBW_ENVIRONMENT.
          FC_PATH=$(ls "$(brew --prefix gcc)/bin"/gfortran-* | head -n 1)
          echo "Using gfortran at: ${FC_PATH}"
          echo "FC=${FC_PATH}" >> "$GITHUB_ENV"

          CIBW_ENV="FC=${FC_PATH}"
          if [ "$(uname -m)" = "arm64" ]; then
            # Homebrew's arm64 bottles for gcc/gfortran's runtime (libgfortran,
            # libgomp, libquadmath) are themselves built requiring a newer
            # minimum macOS than cibuildwheel's default arm64 target (11.0),
            # which makes `delocate-wheel` refuse to repair the wheel. Match
            # the target macOS requires; bump this if a future runner image
            # reports a different "minimum target" in the delocate error.
            CIBW_ENV="${CIBW_ENV} MACOSX_DEPLOYMENT_TARGET=14.0"
          fi
          echo "CIBW_ENVIRONMENT_MACOS=${CIBW_ENV}" >> "$GITHUB_ENV"

      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux* *-win32 *_i686 pp*"
          CIBW_ARCHS_MACOS: "auto"
          # manylinux2014's stock GCC (10.2) is too old to build NumPy's own
          # build dependencies (NumPy requires GCC >= 10.3); manylinux_2_28
          # ships a modern-enough toolchain out of the box.
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "yum install -y gcc-gfortran || dnf install -y gcc-gfortran"
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest {project}/tests -q"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/pyVTTrac
    permissions:
      id-token: write  # trusted publishing (OIDC) -- no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
